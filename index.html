<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17130f">
    <meta name="robots" content="noindex, nofollow">
    <title>Garage Workout Posters</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23d24b2f'/%3E%3Cpath d='M14 24h36v16H14z' fill='white'/%3E%3C/svg%3E"
    >
    <link rel="preload" href="assets/slides/slide-1.png" as="image">
    <link rel="preload" href="assets/slides/slide-2.png" as="image">
    <link rel="preload" href="assets/slides/slide-3.png" as="image">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="slideshow" aria-label="Garage workout posters">
      <figure class="slide is-active" data-slide aria-hidden="false">
        <img
          src="assets/slides/slide-1.png"
          alt="Garage Strength poster with 24 rings, bars, and calisthenics movements."
        >
      </figure>
      <figure class="slide" data-slide aria-hidden="true">
        <img
          src="assets/slides/slide-2.png"
          alt="Garage Strength poster with 24 kettlebell movements."
        >
      </figure>
      <figure class="slide" data-slide aria-hidden="true">
        <img
          src="assets/slides/slide-3.png"
          alt="Garage Strength poster with 24 resistance-band movements."
        >
      </figure>
    </main>

    <div class="controls" role="group" aria-label="Slideshow controls">
      <button type="button" data-previous aria-label="Show previous poster">
        Previous
      </button>
      <button type="button" data-toggle>Pause</button>
      <output data-counter aria-live="polite">1 / 3</output>
      <button type="button" data-next aria-label="Show next poster">
        Next
      </button>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="progress__bar" data-progress></div>
    </div>

    <noscript>
      <p class="noscript">JavaScript is required to rotate the posters.</p>
    </noscript>
  </body>
</html>
